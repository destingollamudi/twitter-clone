<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tweet</title>

  <!-- Default Open Graph Meta Tags (Will be updated dynamically) -->
  <meta property="og:title" content="Check out this tweet!">
  <meta property="og:description" content="See the full conversation and comments.">
  <meta property="og:image" content="">
  <meta property="og:url" content="">
  <meta name="twitter:card" content="summary_large_image">

  <link rel="stylesheet" href="./styles/tweet.css">
  <script>
    window.API_URL = "http://localhost:3500";  // Put your API URL here
  </script>
</head>
<body>
  <div class="main-container">
    <button onclick="goToLanding()" class="back-button">Go Back</button>
    <section id="tweet-container"></section>
  </div>

  <script>
    function goToLanding() {
      window.location.href = "landing.html";
    }

    async function fetchTweetAndUpdateMeta() {
      const urlParams = new URLSearchParams(window.location.search);
      const tweetId = urlParams.get("id");
      
      if (!tweetId) return;

      try {
        const response = await fetch(`${window.API_URL}/api/posts/${tweetId}`);
        const tweet = await response.json();

        // Update page title and meta tags dynamically
        document.title = tweet.text.substring(0, 50) + "...";
        document.querySelector('meta[property="og:title"]').setAttribute("content", tweet.author + " on TwitClone");
        document.querySelector('meta[property="og:description"]').setAttribute("content", tweet.text);
        document.querySelector('meta[property="og:image"]').setAttribute("content", tweet.image || "");
        document.querySelector('meta[property="og:url"]').setAttribute("content", window.location.href);

        // Render tweet in the page
        document.getElementById("tweet-container").innerHTML = `
          <h2>${tweet.author}</h2>
          <p>${tweet.text}</p>
          ${tweet.image ? `<img src="${tweet.image}" alt="Tweet Image" style="max-width: 100%;">` : ""}
        `;
      } catch (error) {
        console.error("Error fetching tweet:", error);
      }
    }

    fetchTweetAndUpdateMeta();
  </script>

  <script src="./tweet.js"></script>
</body>
</html>
